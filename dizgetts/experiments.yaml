# DizgeTTS deney kaydı — TEK KAYNAK. Kurallar: (1) aynı anda en fazla 1 eğitim; (2) yeni koşu = önce burada hipotez + karar kuralı;
# (3) sayılar eval_out/<eval_label>/results.json'dan otomatik gelir (python -m dizgetts.eval.report -> reports/EXPERIMENTS.md).
# Ortak (v1): Antalia 4,2 sa, Matcha + LJSpeech aktarımı, fp32, 150 epoch, tek tohum; 143 eğitimde görülmeyen cümle, Whisper-small + UTMOS.
experiments:
  - id: v1-espeak
    status: closed
    hypothesis: espeak-ng fonemleri (vurgu işaretli) baseline
    eval_label: espeak_ep150
    note: v1 dönemi kapatıldı; checkpoint silindi. En iyi CER, ama vurgu işareti taşıyor.
  - id: v1-espeak-nostress
    status: closed
    hypothesis: baseline'ın avantajı vurgu işaretinden mi?
    eval_label: espeak_nostress_ep150
    note: Evet, büyük kısmı (CER +1,3 pp).
  - id: v1-dizge
    status: closed
    hypothesis: dizge 0.1.6 fonemleri (vurgusuz, sözcük ayracı token'lı)
    eval_label: dizge_ep150
    note: vurgusuz espeak ile eşdeğer (fark anlamsız), UTMOS +0,08.
  - id: v1-dizge-feat
    status: closed
    hypothesis: sözcük sınırı token yerine fonem özniteliği
    eval_label: dizge_feat_ep150
    note: anlaşılırlık kötü; sözcük ayracını atmak (breaks/nosep) yıkıcıydı.
  - id: v1-dizge-breaks / v1-dizge-nosep / v1-dizge-stress
    status: closed
    hypothesis: ayraçsız denemeler; espeak vurgusu aktarımı
    note: anlaşılmaz / durduruldu. Ayrıntı reports/EXPERIMENT_LOG.md.

  - id: v2-m1a
    status: done
    result: "CER 3,6 / WER 11,9 / UTMOS 2,85. vs v1-dizge (vurgusuz): CER -0,96 [-2,57,+0,52] anlamsız; vs vurgulu espeak: +0,65 [-0,02,+1,52] anlamsız. Sonuç: KESİN DEĞİL, nokta tahmini vurgu yönünde."
    hypothesis: dizge fonemleri + KURAL vurgusu M1a (kök sözlüğü + clitic + varsayılan son seslem), sözcük ayracı token'lı. Vurgu işaretinin yalnız kural-tabanlı kaba biçimi de CER'i vurgusuz dizge'den (4,6) düşürür.
    metric: CER (143 cümle, ep150) + WER; UTMOS ikincil
    decision_rule: CER < 4,6 ve fark anlamlı -> vurgu değerli, M1b'ye yatırım; CER ~4,6 -> kaba vurgu yetmez; espeak 3,0'a yaklaşırsa -> kurallar tamam
    config: configs/v2_engine.yaml
    eval_label: v2_m1a_ep150
    note: "M1b (vurgusuz ekler) YOK; espeak vurgusu kullanıcı kurallarında 9/28 doğruydu, son-seslem kuralı bunu kısmen düzeltir. Karşılaştırma: v1-dizge (aynı token'lar, vurgusuz)."
  - id: v2-m1b
    status: done
    depends_on: v2-m1a
    hypothesis: M1a'ya morfolojik vurgu katmanları (-Iyor önü, olumsuzluk, Case=Ins, kişi eki/koşaç; 11% sözcüğün vurgusunu değiştirir) eklemek CER'i M1a'dan düşürür
    metric: CER (143 cümle, ep150) + WER
    decision_rule: M1b CER < M1a CER ve fark anlamlı (eşleşmiş bootstrap) -> katmanlar kalır; anlamsız -> kullanıcı etiketiyle katman katman doğrula
    config: configs/v2_engine_m1b.yaml
    eval_label: v2_m1b_ep150
    note: "kuralların bir kısmı kullanıcı listesinden (olumsuzluk, Ins, kişi eki, koşaç), -Iyor benim eklemem (literatür; onaysız). espeak ile örtüşme: yor %95, kişi eki %74, koşaç %78, Ins %68, olumsuzluk %42 (espeak ölçüt değil)."
    result: "CER 3,0 (M1a 3,6): fark -0,60 [-1,76,+0,25] anlamsız; WER 12,4 (M1a 11,9): +0,59 [-0,86,+1,90] anlamsız; UTMOS 2,83 vs 2,85 anlamsız. Karar kuralı: anlamsız -> katmanlar kullanıcı etiketiyle doğrulanana dek deneysel."
  - id: v2-m3-nostress
    status: not-needed
    note: v1-dizge (aynı token'lar, vurgusuz) zaten bu karşılaştırmayı veriyor (CER 4,6 / WER 13,1); yeniden koşturulmaz

  # ---- dizge-g2p-tts: cümle bazlı G2P (fonem = dizge kuralı; vurgu + sınır = model). TTS eğitimi DEĞİL, ön uç modeli. ----
  - id: g2ptts-v1
    status: done
    hypothesis: >-
      DizgeBERT-Dep kodlayıcısından başlatılan (alt 6 katman + gömme dondurulmuş) iki başlıklı sözcük sınıflandırıcısı,
      (a) SINIR: Antalia kayıtlarından ölçülen sözcük-sınırı sessizliğini (>=60 ms) noktalamasız sınırlarda Dep kuralından (dep_K2) daha iyi tahmin eder;
      (b) VURGU: kural sistemini (M1b + pek/cik + ağırlık; StressRules.version kaydedilir) UD gold biçimbilimi üzerinde damıtır ve yalnız ham metinden yeniden üretir.
    data: "vurgu: UD BOUN+IMST+Kenet (çok-parçalı belirteçli cümleler hariç) + Antalia train (Morph önbelleği); sınır: Antalia train (breaks.jsonl). Seçim: val. Karar: test."
    metric: "sınır: test noktalamasız F1 (eşik val'de); vurgu: kural etiketiyle uyum (UD test + Antalia test) + stress_gold.tsv (35)"
    baseline: "eğitimsiz (eval/boundary_baseline.py, val+test): noktalama F1 0; dep_K2 P 0,342 R 0,442 F1 0,386; tüm sınırlar F1 noktalama 0,738 / dep_K2 0,727"
    decision_rule: >-
      SINIR başlığı yayınlanır ancak test noktalamasız F1 - dep_K2 farkının klip-bootstrap %95 alt sınırı > 0 ise; değilse pakette sınır = dep_K2 kuralı.
      VURGU başlığı yayınlanır ancak kural uyumu >= %97 (UD test) ve gold'da M1b'den (33/35) en çok 1 eksikse; değilse pakette vurgu = kural modülü.
    note: tek koşu, tek tohum; ikinci varyant ancak sonuç yorumlanınca.
    result: >-
      SINIR GEÇTİ: test noktalamasız F1 0,491 (P 0,405 R 0,624, tau 0,25 val'den) vs dep_K2 0,347; fark %95 GA [+0,089, +0,197] (82 klip, 2276 sınır) -> sınır başlığı pakete girer.
      VURGU KALDI: UD test kural uyumu %97,7 (son-dışı %86,5), Antalia %98,9 (son-dışı %94,6) eşiği geçti AMA stress_gold 12/35 (M1b 33/35).
      Tanı: üretken biçimbilim kuralları öğrenildi (koşaç, Ins, kişi eki, belirteç şimdi/belki); sözlük istisnaları (lokanta, İstanbul, -en belirteçleri) ve
      seyrek örüntüler (pekiştirme, -CIk sıfat) hep son hece -> eğitim verisinde örnek yok. Karar kuralı: pakette vurgu = kural modülü.
      Seçim çelişkisi: sınır val F1 ep1'de tepe (0,597 -> 0,549), vurgu ep3'te (son-dışı UD %91,5) -> tek checkpoint iki başlığa en iyi olamaz.
    followup: >-
      Kullanıcı A'yı seçti (2026-09-25): SÖZLÜK ÖNCELİKLİ KARMA (g2ptts/tagger.py) — kural belirleyiciyse (kök/ağırlık/clitic/ünlüsüz) kural, değilse model.
      stress_gold 29/35 (model tek başına 12, M1b 33). Kalan: pekiştirme + -CIk sıfat (4; yüzey kuralı sıfat kapısız kullanılamaz: UD'de pek örüntüsü
      1214 NOUN'a karşı 395 ADJ [arasında, birbirine], -CIk 155 NOUN'a karşı 96 ADJ), semracığım, güzeldir (hiçbir sistem bilmiyor).
  - id: g2ptts-v2
    status: done
    depends_on: g2ptts-v1
    hypothesis: >-
      v1'de sınır başlığı ep1'de tepe yapıp düştü (Antalia x8 tekrar -> aşırı öğrenme), vurgu ep3'e kadar iyileşti; tek checkpoint ikisine en iyi olamadı.
      Antalia tekrarı 8 -> 2 ile sınır tepesi geç epoch'a kayar; seçilen checkpoint'te vurgu (UD son-dışı uyum) v1'den yüksek olur, sınır F1 korunur.
      Veri düzeltmesi (değişken değil): pekiştirme/-CIk etiketleri artık sıfat sözlüğüne kapılı (v1 UD etiketlerinde arasında/emekli/usulca gürültüsü).
    metric: "test noktalamasız sınır F1 (dep_K2 kıyası + v1 0,491); UD test vurgu son-dışı uyum (v1 %86,5; etiketler değiştiği için v1 ile birebir değil); gold (karma tagger)"
    decision_rule: "v2 tagger'ın varsayılanı olur ancak test sınır F1 >= 0,471 (v1 - 0,02) VE UD son-dışı uyum > %86,5 ise; değilse v1 kalır."
    config: "python -m dizgetts.g2ptts.train --run D:/dizgetts/runs/g2ptts_v2 --antalia-repeat 2"
    result: >-
      GEÇTİ -> tagger varsayılanı. Test (seçilen ep1): sınır F1 0,507 (P 0,385 R 0,741) vs dep_K2 0,347, GA [+0,102, +0,214]; UD son-dışı uyum %87,5
      (genel %97,8), Antalia son-dışı %90,6; model tek başına gold 13/35 (karma tagger 33/35). Hipotez kısmen doğru: sınır artık çökmüyor
      (val 0,610/0,606/0,592/0,598; v1 0,597->0,549) ama seçim kuralı (yalnız sınır F1) yine ep1'i aldı; vurgu val son-dışı ep1 %86,6 -> ep4 %94,9.
      Ders: seçim metriği tek başlığa bakıyor; sınır farkı gürültü düzeyindeyken vurgu kazancı büyük -> bkz. g2ptts-v2b.
  - id: g2ptts-v2b
    status: done
    depends_on: g2ptts-v2
    hypothesis: >-
      Aynı reçete (v2, tohum 0), yalnız epoch SEÇİMİ değişir: sınır val F1'i en iyiye 0,02 yakın epoch'lar içinden UD son-dışı vurgu uyumu en yüksek olan.
      v2 val eğrisinde bu ep4'ü seçerdi (sınır 0,598 vs 0,610, vurgu son-dışı %94,9 vs %86,6). Kural v2 val eğrisi GÖRÜLDÜKTEN sonra kondu (post-hoc); test dokunulmadı.
    decision_rule: "v2b varsayılan olur ancak test sınır F1 >= 0,487 (v2 - 0,02) VE UD son-dışı uyum > %87,5 (v2) ise."
    config: "python -m dizgetts.g2ptts.train --run D:/dizgetts/runs/g2ptts_v2b --antalia-repeat 2 --select balanced"
    result: >-
      GEÇTİ -> tagger varsayılanı. Seçilen ep4 (val sınır 0,598, vurgu son-dışı %94,9; eğri v2 ile birebir, tohum 0). Test: sınır F1 0,498
      (P 0,419 R 0,615) vs dep_K2 0,347, GA [+0,090, +0,208]; UD son-dışı uyum %94,9 (v2 %87,5), genel %98,4; Antalia son-dışı %97,0;
      model tek başına gold 17/35 (v2 13), karma tagger 33/35.
  - id: g2ptts-v3
    status: done
    depends_on: g2ptts-v2b
    hypothesis: >-
      v2b reçetesi aynı (Antalia x2, balanced seçim, tohum 0); yalnız VURGU ETİKETLERİ değişir: kullanıcı onaylı yeni kurallar (ek: -ken, -(y)IncA,
      -(y)ArAk, -(y)AlIm, emir; dir: ad + -dIr; tür: türemiş olmayan belirteç/bağlaç/edat -> ağırlık kuralı) + böyle/şöyle/öyle sözlüğü.
      Kurallar geliştirme setinde (stress_gold_random, 250) %76,8 -> %84,4 (M1b+Morph). Damıtılınca karma g2ptts %78,8'den kurallara yaklaşır.
    metric: "stress_gold_random (250, GELİŞTİRME seti: hataları incelendi, böyle sözlükte) karma g2ptts doğruluğu; test noktalamasız sınır F1"
    decision_rule: "v3 varsayılan olur ancak random gold'da karma g2ptts > %78,8 VE test sınır F1 >= 0,478 (v2b - 0,02). Son rapor için yeni kör set gerekir."
    config: "python -m dizgetts.g2ptts.train --run D:/dizgetts/runs/g2ptts_v3 --antalia-repeat 2 --select balanced"
    result: >-
      GEÇTİ -> tagger varsayılanı. Seçilen ep2 (val sınır 0,610, UD son-dışı %89,3; ep3/ep4 sınır toleransı dışında). Random gold (GELİŞTİRME) karma
      g2ptts %86,0 (v2b %78,8; kurallar+Morph %84,4 — model bağlamdan Morph'u yalıtık sözcükte çalıştırmaktan iyi). Test sınır F1 0,496 vs dep_K2 0,347,
      GA [+0,096, +0,201]. UD test uyum %96,6 (son-dışı %89,4; etiketler değişti, v2b ile birebir değil). Model tek başına ilk gold 18/35.

  # ---- v3: Antalia TTS, dizge-g2p-tts ön ucuyla ----
  - id: v3-g2ptts-tts
    status: stopped
    hypothesis: >-
      dizge-g2p-tts etiketleri (g2ptts-v3: karma vurgu, geliştirme setinde %86 vs M1a %65; noktalamasız sınır token'ları) ile eğitilen Matcha,
      aynı reçeteyle eğitilmiş v2-m1a'dan daha anlaşılır (CER/WER) ve en az aynı doğallıkta (UTMOS). Ürün testi: iki değişiklik (vurgu + sınır) birlikte.
    metric: >-
      CER/WER (Whisper-small) + UTMOS, ep150, 543 cümle = Antalia test+val 143 (eğitimde görülmedi) + 400 UD test cümlesi (eval/extra_sentences_ud.txt,
      yalnız metin). v2-m1a ve v2-m1b aynı 543 cümlede yeniden ölçülür (etiket *_x543). Eşleşmiş cümle bootstrap (compare.py).
    decision_rule: >-
      v3 CER < v2-m1a CER ve fark GA üst sınırı < 0 -> dizge-g2p-tts TTS'e yardım ediyor (HF paketi için kanıt); anlamsızsa -> TTS katkısı gösterilemedi,
      paket yine yayınlanabilir ama iddia "ön uç doğruluğu" ile sınırlı kalır. UTMOS anlamlı düşerse -> sınır token'ları ayrı denenir.
    note: >-
      Karıştırıcılar: (1) sınır başlığı Antalia TRAIN sesinden öğrendi -> eğitim cümlelerinde sınır tahmini gerçeğe çok yakın, test cümlelerinde değil
      (kullanıcıyla konuşuldu, bilerek model tahmini kullanılıyor). (2) v2-m1a/m1b sentezi GÜNCEL kural sürümüyle yapılır (böyle/şöyle/öyle, pek/-CIk kapısı
      değişti) -> eğitim token'larından küçük sapma; v2-m1a Antalia 143'te eski CER 3,6 ile kıyaslanarak kontrol edilir.
    config: configs/v3_g2ptts.yaml
    eval_label: v3_g2ptts_ep150_x543
    result: >-
      DURDURULDU ep60 (önceden konmuş kontrol noktası: train_dur ep60'ta <0,55 değilse dur). train_dur ep5-60 0,587-0,594 düz (v2-m1a aynı reçetede
      ep20 0,47, ep30 0,43); grad_norm iki koşuda aynı (~0,35) -> kararsızlık değil, hizalama (MAS) takılması. v1 breaks koşusu da (ayraçsız + sınır
      token'ı) 0,80'de hiç kırılmadı -> v1'deki çöküşün bir kısmı da sınır token'larından olabilir. Checkpoint'ler (ep25/ep50/last) duruyor.
  - id: v3a-g2ptts-nobreaks
    status: done
    depends_on: v3-g2ptts-tts
    hypothesis: >-
      v3'ten sınır token'ları çıkarılınca (yalnız karma vurgu, sözcük ayracı + noktalama v2 ile aynı) hizalama v2-m1a gibi kurulur ve g2ptts vurgusu
      (kör test %92,8 vs M1a %83,5) v2-m1a'dan daha anlaşılır konuşma verir. Tek değişken v2-m1a'ya göre: vurgu kaynağı.
    metric: "CER/WER + UTMOS, ep150, 543 cümle (143 Antalia + 400 UD); v2-m1a / v2-m1b aynı 543'te (compare.py, eşleşmiş bootstrap)"
    decision_rule: >-
      Erken kontrol (2026-09-25 DÜZELTİLDİ, v3a ep20'de 0,60 görüldükten sonra): ep60'ta train_dur < 0,55 değilse durdur. İlk kural (ep30 <= 0,50)
      fazla katıydı: geçmiş koşularda hizalama 'oturma' anı ep10-50 arası değişiyor (v2-m1b ep30'da 0,58, ep50'de 0,45 ve en iyi CER'i verdi). Son: v3a CER < v2-m1a ve fark GA üst sınırı < 0 -> g2ptts vurgusu TTS'e
      yardım ediyor; anlamsız -> TTS katkısı gösterilemedi (paket iddiası ön uç doğruluğuyla sınırlı).
    config: configs/v3a_g2ptts_nobreaks.yaml
    eval_label: v3a_g2ptts_nb_ep150_x543
    result: >-
      TTS KATKISI GÖSTERİLEMEDİ (karar kuralı). 543 cümle: CER v2-m1a 4,0 / v3a 4,0, fark +0,04 [-0,27, +0,38]; WER 15,4 -> 15,2, -0,20 [-1,13, +0,75];
      UTMOS 3,02 -> 2,99, -0,03 [-0,05, -0,01] (anlamlı, küçük). Antalia 143: CER 3,59 -> 3,77 (+0,18 [-0,24, +0,69]); UD 400: 4,49 -> 4,37 (-0,12
      [-0,52, +0,24]). v2-m1a Antalia 3,59 (eski 3,6) -> kural sürümü kayması ihmal edilebilir. Hizalama ep20-30 arası oturdu (ep30 0,459).
      Yorum: Whisper CER vurguya duyarsız (ASR yanlış heceli vurguyu tolere eder); vurgu anlaşılırlıktan çok doğallığı etkiler; UTMOS İngilizce eğitimli.
      Sonraki: kör AB dinleme testi (vurgusu farklı ~30 cümle, v2-m1a vs v3a).

  # ---- ölçüm (eğitim yok) ----
  - id: prosody-acoustic-v3a
    status: done
    hypothesis: "v3a sentezinin 'her sözcük ayrı kayıt' algısının akustik karşılığı nerede (F0 / enerji / eğim / formant / ritim)?"
    result: >-
      reports/prosody_acoustic_v3a.md. Sözcük içi F0 desenleri gerçek ≈ sentez (anlamsız). Farklar ZAMANLAMADA: ünlü süresi nPVI 45 -> 27, noktalamalı
      duraklama 472 -> 260 ms (>=250 ms noktalamasız %1,7 -> %0), öbek sonu uzaması zayıf (virgül 1,42 -> 1,22), eklemleme 6,5 -> 6,1 hece/sn,
      virgül yükselişi abartılı (+1,0 yt). Yöntem düzeltmesi: add_blank kareleri yarı yarıya dağıtılmazsa ünlüler 1-2 kare kalıyor ve sahte eğim farkı çıkıyordu.
  - id: v4-dpfeat
    status: done
    depends_on: [v3a-g2ptts-nobreaks, prosody-acoustic-v3a]
    hypothesis: >-
      Sentezin zamanlaması düz (nPVI 27 vs 45; noktalamalı duraklama 260 vs 472 ms; virgül öncesi uzama 1,22 vs 1,42) çünkü süre tahmincisi log-MSE
      ile iki tepeli duraklama dağılımının (0 ms ya da 400-1500 ms) geometrik ortasını öğreniyor ve sınırı bilmiyor. Süre tahmincisine YALNIZ sınır
      sınıfı (g2ptts sınırı + noktalama) verilince duraklama ve öbek sonu uzaması gerçeğe yaklaşır. Kodlayıcı/token'lar v3a ile aynı -> tek değişken.
    metric: "prosody_acoustics compare v4 vs v3a (143 test+val, eşleşmiş klip bootstrap) + CER/WER/UTMOS 543 cümle"
    decision_rule: >-
      v4 KABUL: (a) noktalamalı duraklama VE virgül/; son ünlü uzaması v3a'ya göre anlamlı biçimde gerçeğe doğru (GA alt sınırı > 0) VE
      (b) CER farkı (v4 - v3a) GA üst sınırı < +0,5 pp. nPVI raporlanır (kısmi etki beklenir; zorunlu değil). Erken kontrol: ep60 train_dur < 0,55.
    note: "sınır sınıfları eğitim cümlelerinde g2ptts sınır modelinin (Antalia train sesinden öğrendi) tahmini -> train'de gerçeğe yakın, testte değil (bilinen)."
    config: configs/v4_g2ptts_dpfeat.yaml
    eval_label: v4_g2ptts_dp_ep150_x543
    result: >-
      KABUL EDİLMEDİ (karar kuralı): noktalamalı duraklama 260 -> 280 ms (+20 [+16, +25], gerçek 472); virgül öncesi uzama 1,22 -> 1,26
      (+0,03 [-0,00, +0,07] anlamsız, gerçek 1,42); nPVI 26,8 -> 27,1 anlamsız. CER 4,0 = 4,0 (-0,06 [-0,35, +0,23]); UTMOS +0,02 anlamlı.
      Yan etki: vurguya yükseliş -0,33 yt, vurgulu-vurgusuz F0 -0,25 yt (ezgi hareketi biraz azaldı).
      TANI (eğitimsiz): virgül bölgesi hedef/tahmin — train medyan 360/263 ms, std 202/99, log-korelasyon 0,72; val 395/278, std 233/96, 0,74.
